{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5194922909756658"
     crossorigin="anonymous"></script>
    {% block meta_tags %}
    <!-- Default Description -->
    <meta name="description" content="{% block meta_description %}21K Tools - Free online tools for URL shortening, PDF editing, file conversion, image resizing, calculators and more. Make your work easier with our powerful tool collection.{% endblock %}">
    
    <!-- Default Keywords -->
    <meta name="keywords" content="{% block meta_keywords %}online tools, free tools, URL shortener, PDF tools, file converter, image resizer, calculators, 21k tools{% endblock %}">
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://{{ request.get_host }}{{ request.path }}">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="{% block og_type %}website{% endblock %}">
    <meta property="og:url" content="https://{{ request.get_host }}{{ request.path }}">
    <meta property="og:title" content="{% block og_title %}{{ self.title }}{% endblock %}">
    <meta property="og:description" content="{% block og_description %}21K Tools - Free online tools for URL shortening, PDF editing, file conversion, image resizing, calculators and more.{% endblock %}">
    <meta property="og:site_name" content="21K Tools">
    
    <!-- Default OG Image - ICON FOR ALL PAGES -->
    {% block og_image %}
    <meta property="og:image" content="https://{{ request.get_host }}{% static '21k.png' %}">
    <meta property="og:image:secure_url" content="https://{{ request.get_host }}{% static '21k.png' %}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    <meta property="og:image:alt" content="21K Tools Logo">
    {% endblock %}
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@21ktools">
    <meta name="twitter:creator" content="@21ktools">
    <meta name="twitter:title" content="{% block twitter_title %}{{ self.title }}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}21K Tools - Free online tools for URL shortening, PDF editing, file conversion, image resizing, calculators and more.{% endblock %}">
    
    <!-- Default Twitter Image - ICON FOR ALL PAGES -->
    {% block twitter_image %}
    <meta name="twitter:image" content="https://{{ request.get_host }}{% static '21k.png' %}">
    <meta name="twitter:image:alt" content="21K Tools Logo">
    {% endblock %}
    
    <!-- Additional Meta -->
    <meta property="og:locale" content="en_US">
    <meta name="twitter:domain" content="{{ request.get_host }}">
    {% endblock meta_tags %}
    
    <link rel="icon" type="image/x-icon" href="{% static '21k.png' %}">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Blog System{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #dbeafe;
            --secondary: #64748b;
            --text-dark: #0f172a;
            --text-light: #f8fafc;
            --border: #e2e8f0;
            --bg-light: #f9fafb;
        }

        * {
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }
        /* Remove underlines from all links */
a {
    text-decoration: none;
}

/* Optional: Add underline on hover for better UX */
a:hover {
    text-decoration: none;
}


        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
          
            min-height: 100vh;
            clor: var(--text-dark);
            display: flex;
            flex-direction: column;
            line-height: 1.6;
              
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
  background-attachment: fixed !important;

  

        }

        /* ==================== HEADER ==================== */
        .header {
            background: white;
            box-shadow: 0 4px 20px rgba(30, 64, 175, 0.3);
            position: sticky; 
            top: 0; 
            z-index: 1000;
        }
        
        .header-container {
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px;
        }
        
        .logo-container {
            display: flex;
            justify-content: center;
            padding: 15px 0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            font-size: 28px;
            font-weight: 800;
            text-decoration: none !important;
            color: #2563eb;
            gap: 8px;
            transition: transform 0.3s ease;
        }
        .logo:hover {
            transform: scale(1.05);
        }
        
        .logo-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 102px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
        }

        
      .header-actions-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    gap: 10px;
    width: 100%;
   
}

.search-box {
    position: relative; 
    flex-grow: 1;
    max-width: 700px;
    width: 100%;
    margin: 0 auto;
}

.search-input {
    width: 100%;
    background: rgba(255, 255, 255, 0.8);
    border: 2px solid rgba(59, 130, 246, 0.2);
    border-radius: 30px;
    padding: 12px 50px 12px 20px;
    font-size: 15px;
    transition: all 0.3s ease;
}

.search-input:focus {
    outline: none;
    background: rgba(255, 255, 255, 0.95);
    border-color: #3b82f6;
    box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}

.search-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
}

.search-btn:hover {
    transform: translateY(-50%) scale(1.1);
    box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4);
}

        .mobileToggle {
            cursor: pointer;
            padding: 10px;
            display: none;
            background: none;
            border: none;
            flex-direction: column;
            gap: 6px;
        }
        
        .mobileToggle .bar {
            width: 23px; 
            height: 2px; 
            background-color: #1e3a8a;
            transition: 0.4s;
        }
        
        .mobileToggle.change .bar:nth-child(1) { transform: translate(0, 8px) rotate(-45deg); }
        .mobileToggle.change .bar:nth-child(2) { opacity: 0; }
        .mobileToggle.change .bar:nth-child(3) { transform: translate(0, -8px) rotate(45deg); }

        .header-nav {
            width: 100%;
        }

        .nav-menu {
            display: flex; 
            gap: 10px; 
            margin-top: 15px; 
            padding-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-link {
            color: #1e40af;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(59, 130, 246, 0.2);
            color: #1e40af;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-radius: 12px;
            z-index: 1;
            padding: 10px 0;
            grid-template-columns: 1fr;
            gap: 5px;
        }
        
        .dropdown.active .dropdown-content {
            display: grid;
        }
        
        .dropdown-content a {
            color: #1e40af;
            padding: 10px 20px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        
        .dropdown-content a:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .mobile-panel {
            display: none; 
            flex-direction: column; 
            gap: 15px;
            background: white; 
            padding: 20px; 
            position: absolute;
            top: 100%; 
            left: 0; 
            width: 100%;
            animation: slideDown 0.4s ease-in-out;
            z-index: 999;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }
        
        .mobile-panel.show { display: flex; }

        .mobile-dropdown {
            position: relative;
        }

        .mobile-dropdown-content {
            display: none;
            padding-left: 20px;
            margin-top: 10px;
            flex-direction: column;
            gap: 10px;
        }
        
        .mobile-dropdown.active .mobile-dropdown-content {
            display: flex;
        }
        
        .mobile-dropdown-content a {
            color: #1e40af;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .mobile-dropdown-content a:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .rotate-180 {
            transform: rotate(540deg);
            transition: transform 2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-wrapper {
            flex: 1;
        }

        /* ==================== FOOTER ==================== */
        .footer {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: white; 
            margin-top: 80px;
        }
        
        .footer-container {
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 50px 20px 20px;
        }
        
        .footer-content {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px; 
            margin-bottom: 40px;
        }
        
        .footer-section h3 {
            color: #60a5fa; 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 20px;
        }

        .footer-links {
            list-style: none;
        }
        
        .footer-links li {
            margin-bottom: 10px;
        }
        
        .footer-links a {
            color: rgba(255, 255, 255, 0.8); 
            text-decoration: none; 
            transition: color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .footer-links a:hover { 
            color: #60a5fa;
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 0; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px;
        }
        
        .footer-brand {
            display: flex; 
            align-items: center; 
            gap: 10px;
        }

        .footer-brand-icon {
            width: 38px; 
            height: 38px; 
            background: #3b82f6;
            border-radius: 20px; 
            display: flex; 
            align-items: center;
            justify-content: center; 
            font-weight: bold;
            font-size: 14px;
        }
        
        .social-links {
            display: flex; 
            gap: 15px;
        }
        
        .social-link {
            width: 40px; 
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%; 
            display: flex;
            align-items: center; 
            justify-content: center;
            color: white; 
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .social-link:hover {
            background: #3b82f6; 
            transform: translateY(-2px);
        }
       .explore-section {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 80px 20px;
        margin: 80px 0 0;;
        border-radius: 20px;
        text-align: center;
    }

    .explore-title {
        font-size: clamp(1.8rem, 2.2vw, 2.3rem);
        font-weight: 900;
        margin-bottom: 16px;
        color:white;
    }

    .explore-desc {
        font-size: clamp(0.95rem, 1vw, 1.05rem);
        opacity: 0.93;
        max-width: 650px;
        margin: 0 auto 45px;
        line-height: 1.7;
        color:white;
    }

    .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 22px;
        max-width: 1100px;
        margin: 0 auto 36px;
    }

    .tool-card {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 16px;
        padding: 32px 22px;
        text-decoration: none;
        color: white;
        transition: all 0.3s ease;
    }

    .tool-card:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.4);
    }

    .tool-icon {
        font-size: 2.2rem;
        margin-bottom: 14px;
        display: block;
    }

    .tool-card h5 {
        font-size: 1.1rem;
        font-weight: 800;
        margin-bottom: 10px;
    }

    .tool-desc {
        font-size: 0.9rem;
        opacity: 0.88;
        color:white;
    }

    .explore-cta {
        display: inline-block;
        background: white;
        color: #667eea;
        padding: 13px 36px;
        border-radius: 30px;
        text-decoration: none;
        font-weight: 800;
        font-size: 0.95rem;
        transition: all 0.3s ease;
    }

    .explore-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    }


        /* ==================== MESSAGES ==================== */
        .messages-container {
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
            z-index: 100;
            position: relative;
        }

        .alert {
            border-radius: 12px;
            border: none;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            animation: slideDown 0.3s ease-out;
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(5, 150, 105, 0.1));
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-error, .alert-danger {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.1));
            color: #7f1d1d;
            border-left: 4px solid #ef4444;
        }

        .alert-info {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(37, 99, 235, 0.1));
            color: #1e40af;
            border-left: 4px solid #3b82f6;
        }

        .alert-warning {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(217, 119, 6, 0.1));
            color: #78350f;
            border-left: 4px solid #f59e0b;
        }

        .btn-close {
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .btn-close:hover {
            opacity: 1;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 1024px) {
            .header-actions-container {
                gap: 12px;
            }

            .controls-section {
                max-width: 400px;
            }

            .nav-menu {
                gap: 6px;
            }

            .nav-link {
                padding: 8px 14px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 768px) {
            .nav-menu { 
                display: none; 
            }
            
            .mobileToggle {
                display: flex;
            }

            .header-actions-container {
                gap: 8px;
            }

            .controls-section {
                max-width: none;
            }

            .search-form input {
                font-size: 14px;
                padding: 10px 14px;
            }

            .footer-bottom { 
                flex-direction: column; 
                text-align: center; 
            }
            
            .footer-content {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 30px;
            }

            .dropdown-content {
                position: fixed;
                bottom: auto;
                top: auto;
            }
        }

        @media (max-width: 576px) {
            .header-container {
                padding-left: 12px; 
                padding-right: 12px;
            }

            .footer-container {
                padding-left: 12px; 
                padding-right: 12px;
                padding-top: 40px;
                padding-bottom: 20px;
            }

            .logo {
                font-size: 22px;
                gap: 8px;
            }

            .logo-icon {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .controls-section {
                max-width: 100%;
            }

            .footer-content {
                grid-template-columns: 1fr;
                gap: 25px;
            }

            .footer-brand,
            .social-links {
                width: 100%;
                justify-content: center;
            }

            .messages-container {
                padding: 0 12px;
                margin: 15px auto;
            }

.search-input { 
        min-width: 150px; 
      }
            .alert {
                flex-wrap: wrap;
                padding: 14px 16px;
            }
        }</style>

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
